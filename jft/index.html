<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan JFT A2 - Soal 1</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .quiz-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .question-title {
      font-size: 14px;
      color: #666;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .question-text {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    ruby rt {
      font-size: 0.6em;
      color: #e65100;
    }
    .translation {
      display: block;
      font-size: 14px;
      color: #666;
      font-weight: normal;
      margin-top: 4px;
    }
    .image-container {
      margin: 16px 0;
      border: 2px solid #eef2f5;
      border-radius: 8px;
      overflow: hidden;
      background-color: #fafafa;
    }
    .image-container img {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      display: block;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    .btn-option {
      background-color: #ffffff;
      border: 2px solid #007bff;
      color: #007bff;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }
    .btn-option:hover {
      background-color: #007bff;
      color: #ffffff;
    }
    .btn-option:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }
    /* Warna feedback jawaban */
    .btn-option.correct {
      background-color: #28a745 !important;
      border-color: #28a745 !important;
      color: #ffffff !important;
    }
    .btn-option.incorrect {
      background-color: #dc3545 !important;
      border-color: #dc3545 !important;
      color: #ffffff !important;
    }
    #result-message {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      min-height: 27px;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <div class="question-title">Soal Nomor 1</div>
    
    <!-- Instruksi Soal dengan Furigana -->
    <div class="question-text">
      <ruby>正<rt>ただ</rt></ruby>しいものを<ruby>選<rt>えら</rt></ruby>びましょう。
      <span class="translation">Pilihlah kata yang benar.</span>
    </div>

    <!-- Gambar Ilustrasi dari Irodori -->
    <div class="image-container">
      <!-- Ubah path src sesuai lokasi file gambar kamu di GitHub -->
      <img src="assets/images/X_11_3_11_benkyoosuru.png" alt="Ilustrasi Soal 1">
    </div>

    <!-- Pilihan Jawaban -->
    <div class="options-container">
      <button class="btn-option" onclick="checkAnswer(1, this)">1. べんきょうします</button>
      <button class="btn-option" onclick="checkAnswer(2, this)">2. なおします</button>
      <button class="btn-option" onclick="checkAnswer(3, this)">3. かわります</button>
    </div>

    <!-- Hasil Jawaban -->
    <div id="result-message"></div>
  </div>

  <script>
    // Kunci jawaban: pilihan nomor 1 (べんきょうします)
    const correctAnswer = 1;

    function checkAnswer(selectedOption, element) {
      const resultDiv = document.getElementById('result-message');
      const allButtons = document.querySelectorAll('.btn-option');

      // Nonaktifkan semua tombol setelah memilih
      allButtons.forEach(btn => btn.disabled = true);

      if (selectedOption === correctAnswer) {
        element.classList.add('correct');
        resultDiv.innerHTML = "⭕ 正解 (Benar)!";
        resultDiv.style.color = "#28a745";
      } else {
        element.classList.add('incorrect');
        // Tandai juga mana yang seharusnya benar
        allButtons[correctAnswer - 1].classList.add('correct');
        resultDiv.innerHTML = "❌ 不正解 (Salah)!";
        resultDiv.style.color = "#dc3545";
      }
    }
  </script>

</body>
</html>
