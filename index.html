<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Kanji 入門 (Nyuumon)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        /* Container Card 3D Flip */
        .card-container {
            width: 320px;
            height: 220px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            background-color: var(--card-bg);
            box-sizing: border-box;
            padding: 20px;
            text-align: center;
            border: 2px solid #e0e0e0;
        }

        /* Depan: Kanji */
        .card-front {
            color: var(--primary-color);
        }

        .kanji {
            font-size: 3.5rem;
            font-weight: bold;
        }

        .hint {
            font-size: 0.8rem;
            color: #bdc3c7;
            margin-top: 15px;
        }

        /* Belakang: Cara Baca & Arti */
        .card-back {
            transform: rotateY(180deg);
            background-color: #fdfdfd;
        }

        .reading {
            font-size: 1.6rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .meaning {
            font-size: 1.2rem;
            color: #34495e;
        }

        /* Navigasi & Kontrol */
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #34495e;
        }

        button:active {
            transform: scale(0.98);
        }

        button.btn-shuffle {
            background-color: #27ae60;
        }

        button.btn-shuffle:hover {
            background-color: #219150;
        }

        .counter {
            font-size: 0.95rem;
            color: #7f8c8d;
            font-weight: bold;
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <h1>Flashcard Kanji 入門</h1>
    <div class="subtitle">Klik atau tap kartu untuk melihat cara baca dan artinya</div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="flashcard">
            <!-- Sisi Depan -->
            <div class="card-face card-front">
                <div class="kanji" id="card-kanji">名前</div>
                <div class="hint">Klik untuk membalik</div>
            </div>
            <!-- Sisi Belakang -->
            <div class="card-face card-back">
                <div class="reading" id="card-reading">なまえ</div>
                <div class="meaning" id="card-meaning">nama</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()">◄ Sebelumnya</button>
        <span class="counter" id="card-counter">1 / 92</span>
        <button onclick="nextCard()">Berikutnya ►</button>
        <button class="btn-shuffle" onclick="shuffleCards()">🔀 Acak Kartu</button>
    </div>

    <script>
        // Data 92 Kosakata Nyuumon
        const rawVocab = [
            { kanji: "名前", reading: "なまえ", meaning: "nama" },
            { kanji: "国", reading: "くに", meaning: "negara" },
            { kanji: "私", reading: "わたし", meaning: "saya" },
            { kanji: "父", reading: "ちち", meaning: "ayah" },
            { kanji: "母", reading: "はは", meaning: "ibu" },
            { kanji: "子ども", reading: "こども", meaning: "anak" },
            { kanji: "日本", reading: "にほん", meaning: "Jepang" },
            { kanji: "～曜日", reading: "～ようび", meaning: "hari ~" },
            { kanji: "～日", reading: "～にち", meaning: "tanggal ~ / jumlah hari ~" },
            { kanji: "今日", reading: "きょう", meaning: "hari ini" },
            { kanji: "日本語", reading: "にほんご", meaning: "bahasa Jepang" },
            { kanji: "本", reading: "ほん", meaning: "buku" },
            { kanji: "水", reading: "みず", meaning: "air" },
            { kanji: "水", reading: "すい", meaning: "hari Rabu (singkatan 水曜日)" },
            { kanji: "食べます", reading: "たべます", meaning: "makan" },
            { kanji: "飲みます", reading: "のみます", meaning: "minum" },
            { kanji: "魚", reading: "さかな", meaning: "ikan" },
            { kanji: "肉", reading: "にく", meaning: "daging" },
            { kanji: "好き（な）", reading: "すき（な）", meaning: "suka" },
            { kanji: "家", reading: "いえ", meaning: "rumah" },
            { kanji: "新しい", reading: "あたらしい", meaning: "baru" },
            { kanji: "広い", reading: "ひろい", meaning: "luas" },
            { kanji: "古い", reading: "ふるい", meaning: "lama / tua" },
            { kanji: "上", reading: "うえ", meaning: "atas" },
            { kanji: "下", reading: "した", meaning: "bawah" },
            { kanji: "中", reading: "なか", meaning: "dalam / tengah" },
            { kanji: "月", reading: "げつ", meaning: "hari Senin (singkatan 月曜日)" },
            { kanji: "～月", reading: "～がつ", meaning: "bulan ~" },
            { kanji: "火", reading: "か", meaning: "hari Selasa (singkatan 火曜日)" },
            { kanji: "木", reading: "もく", meaning: "hari Kamis (singkatan 木曜日)" },
            { kanji: "金", reading: "きん", meaning: "hari Jumat (singkatan 金曜日)" },
            { kanji: "土", reading: "ど", meaning: "hari Sabtu (singkatan 土曜日)" },
            { kanji: "朝", reading: "あさ", meaning: "pagi" },
            { kanji: "昼", reading: "ひる", meaning: "siang" },
            { kanji: "夜", reading: "よる", meaning: "malam" },
            { kanji: "～時", reading: "～じ", meaning: "jam ~" },
            { kanji: "～分", reading: "～ふん", meaning: "menit ~" },
            { kanji: "～半", reading: "～はん", meaning: "setengah / 30 menit" },
            { kanji: "～枚", reading: "～まい", meaning: "lembar (satuan hitung benda tipis)" },
            { kanji: "読みます", reading: "よみます", meaning: "membaca" },
            { kanji: "聞きます", reading: "ききます", meaning: "mendengarkan / bertanya" },
            { kanji: "見ます", reading: "みます", meaning: "melihat" },
            { kanji: "友だち", reading: "ともだち", meaning: "teman" },
            { kanji: "何", reading: "なに", meaning: "apa" },
            { kanji: "～年", reading: "～ねん", meaning: "tahun ~" },
            { kanji: "今週", reading: "こんしゅう", meaning: "minggu ini" },
            { kanji: "今度", reading: "こんど", meaning: "kali ini / lain kali" },
            { kanji: "東", reading: "ひがし", meaning: "timur" },
            { kanji: "西", reading: "にし", meaning: "barat" },
            { kanji: "南", reading: "みなみ", meaning: "selatan" },
            { kanji: "北", reading: "きた", meaning: "utara" },
            { kanji: "会社", reading: "かいしゃ", meaning: "perusahaan" },
            { kanji: "来ます", reading: "きます", meaning: "datang" },
            { kanji: "行きます", reading: "いきます", meaning: "pergi" },
            { kanji: "乗ります", reading: "のります", meaning: "naik (kendaraan)" },
            { kanji: "大きい", reading: "おおきい", meaning: "besar" },
            { kanji: "小さい", reading: "ちいさい", meaning: "kecil" },
            { kanji: "高い", reading: "たかい", meaning: "tinggi / mahal" },
            { kanji: "低い", reading: "ひくい", meaning: "rendah" },
            { kanji: "前", reading: "まえ", meaning: "depan / sebelum" },
            { kanji: "後ろ", reading: "うしろ", meaning: "belakang" },
            { kanji: "横", reading: "よこ", meaning: "samping" },
            { kanji: "入口", reading: "いりぐち", meaning: "pintu masuk" },
            { kanji: "出口", reading: "でぐち", meaning: "pintu keluar" },
            { kanji: "～階", reading: "～かい", meaning: "lantai ~" },
            { kanji: "押す", reading: "おす", meaning: "menekan / mendorong" },
            { kanji: "引く", reading: "ひく", meaning: "menarik" },
            { kanji: "安い", reading: "やすい", meaning: "murah" },
            { kanji: "一", reading: "いち", meaning: "satu" },
            { kanji: "二", reading: "に", meaning: "dua" },
            { kanji: "三", reading: "さん", meaning: "tiga" },
            { kanji: "四", reading: "よん", meaning: "empat" },
            { kanji: "五", reading: "ご", meaning: "lima" },
            { kanji: "六", reading: "ろく", meaning: "enam" },
            { kanji: "七", reading: "なな", meaning: "tujuh" },
            { kanji: "八", reading: "はち", meaning: "delapan" },
            { kanji: "九", reading: "きゅう", meaning: "sembilan" },
            { kanji: "十", reading: "じゅう", meaning: "sepuluh" },
            { kanji: "百", reading: "ひゃく", meaning: "seratus" },
            { kanji: "千", reading: "せん", meaning: "seribu" },
            { kanji: "万", reading: "まん", meaning: "sepuluh ribu" },
            { kanji: "～円", reading: "～えん", meaning: "yen ~" },
            { kanji: "休み", reading: "やすみ", meaning: "libur / istirahat" },
            { kanji: "映画", reading: "えいが", meaning: "film" },
            { kanji: "勉強します", reading: "べんきょうします", meaning: "belajar" },
            { kanji: "買います", reading: "かいます", meaning: "membeli" },
            { kanji: "温泉", reading: "おんせん", meaning: "pemandian air panas" },
            { kanji: "予定", reading: "よてい", meaning: "rencana" },
            { kanji: "来週", reading: "らいしゅう", meaning: "minggu depan" },
            { kanji: "会います", reading: "あいます", meaning: "bertemu" },
            { kanji: "入ります", reading: "はいります", meaning: "masuk" },
            { kanji: "旅行します", reading: "りょこうします", meaning: "bepergian / jalan-jalan" }
        ];

        let vocabList = [...rawVocab];
        let currentIndex = 0;
        let isFlipped = false;

        const cardElement = document.getElementById('flashcard');
        const kanjiElement = document.getElementById('card-kanji');
        const readingElement = document.getElementById('card-reading');
        const meaningElement = document.getElementById('card-meaning');
        const counterElement = document.getElementById('card-counter');

        function updateCard() {
            // Pastikan kartu kembali ke posisi depan saat berpindah kartu
            if (isFlipped) {
                cardElement.classList.remove('flipped');
                isFlipped = false;
                setTimeout(renderContent, 200); // Tunggu animasi flip setengah jalan
            } else {
                renderContent();
            }
        }

        function renderContent() {
            const current = vocabList[currentIndex];
            kanjiElement.textContent = current.kanji;
            readingElement.textContent = current.reading;
            meaningElement.textContent = current.meaning;
            counterElement.textContent = `${currentIndex + 1} / ${vocabList.length}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            cardElement.classList.toggle('flipped');
        }

        function nextCard() {
            if (currentIndex < vocabList.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0; // Kembali ke awal jika sudah di kartu terakhir
            }
            updateCard();
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = vocabList.length - 1; // Ke kartu terakhir jika di posisi awal
            }
            updateCard();
        }

        function shuffleCards() {
            // Algoritma Fisher-Yates Shuffle
            for (let i = vocabList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [vocabList[i], vocabList[j]] = [vocabList[j], vocabList[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        // Jalankan tampilan awal saat halaman dibuka
        renderContent();
    </script>
</body>
</html>
