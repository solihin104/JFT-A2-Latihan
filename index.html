<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Kanji Irodori (Nyuumon & A2.1)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --success-color: #27ae60;
            --warning-color: #e67e22;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
            text-align: center;
            font-size: 1.8rem;
        }

        /* Filter & Stats Container */
        .filter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 360px;
        }

        .select-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .filter-select {
            padding: 8px 10px;
            border-radius: 8px;
            border: 2px solid var(--primary-color);
            background-color: white;
            font-size: 0.9rem;
            color: var(--primary-color);
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.85rem;
            color: #7f8c8d;
            font-weight: bold;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge-mastered { color: var(--success-color); }
        .badge-unmastered { color: var(--accent-color); }

        /* Container Card 3D Flip */
        .card-container {
            width: 320px;
            height: 220px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            background-color: var(--card-bg);
            box-sizing: border-box;
            padding: 20px;
            text-align: center;
            border: 3px solid #e0e0e0;
        }

        /* Border indicator berdasarkan status */
        .status-tag {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 12px;
        }

        .status-tag.mastered {
            background-color: #e8f8f5;
            color: var(--success-color);
        }

        .status-tag.unmastered {
            background-color: #fadbd8;
            color: var(--accent-color);
        }

        .level-tag {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 12px;
            background-color: #ebf5fb;
            color: #2980b9;
        }

        /* Depan: Kanji */
        .card-front {
            color: var(--primary-color);
        }

        .kanji {
            font-size: 3.2rem;
            font-weight: bold;
        }

        .hint {
            font-size: 0.8rem;
            color: #bdc3c7;
            margin-top: 15px;
        }

        /* Belakang: Cara Baca & Arti */
        .card-back {
            transform: rotateY(180deg);
            background-color: #fdfdfd;
        }

        .reading {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .meaning {
            font-size: 1.1rem;
            color: #34495e;
        }

        /* Tombol Aksi Hafal / Belum */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            width: 320px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-master { background-color: var(--success-color); }
        .btn-unmaster { background-color: var(--accent-color); }

        /* Navigasi Kiri Kanan & Shuffle */
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background-color: #34495e; }
        button:active { transform: scale(0.98); }

        .btn-shuffle { background-color: var(--warning-color); }
        .btn-shuffle:hover { background-color: #d35400; }

        .counter {
            font-size: 0.95rem;
            color: #7f8c8d;
            font-weight: bold;
            margin: 0 5px;
        }

        .empty-message {
            display: none;
            text-align: center;
            color: #7f8c8d;
            font-size: 1.1rem;
            margin: 40px 0;
        }
    </style>
</head>

    <!-- Container Card 3D -->

            <!-- Sisi Belakang -->

        </div>
    </div>

    <!-- Tombol Penanda Hafal / Belum -->

        <button class="btn-action btn-master" onclick="markStatus(true)">✅ Sudah Hafal</button>
    </div>

    <!-- Controls Navigasi -->

        // Load status hafal dari LocalStorage
        let masteredIds = JSON.parse(localStorage.getItem('kanji_mastered_ids_v2')) || [];

        let currentFilteredList = [];
        let currentIndex = 0;
        let isFlipped = false;

        const cardElement = document.getElementById('flashcard');
        const kanjiElement = document.getElementById('card-kanji');
        const readingElement = document.getElementById('card-reading');
        const meaningElement = document.getElementById('card-meaning');
        const counterElement = document.getElementById('card-counter');
        const levelSelect = document.getElementById('levelSelect');
        const statusSelect = document.getElementById('statusSelect');
        const emptyMessage = document.getElementById('emptyMessage');
        const actionButtons = document.getElementById('actionButtons');
        const controls = document.getElementById('controls');
        
        const statusTagFront = document.getElementById('statusTagFront');
        const statusTagBack = document.getElementById('statusTagBack');
        const levelTagFront = document.getElementById('levelTagFront');
        const levelTagBack = document.getElementById('levelTagBack');

        // Apply Filter Level & Status
        function applyFilter() {
            const selectedLevel = levelSelect.value;
            const selectedStatus = statusSelect.value;

            currentFilteredList = rawVocab.filter(item => {
                const matchLevel = (selectedLevel === 'all') || (item.level === selectedLevel);
                const isMastered = masteredIds.includes(item.id);
                const matchStatus = (selectedStatus === 'all') || 
                                    (selectedStatus === 'mastered' && isMastered) || 
                                    (selectedStatus === 'unmastered' && !isMastered);
                return matchLevel && matchStatus;
            });

            currentIndex = 0;
            updateCardDisplay();
        }

        function updateStats() {
            const selectedLevel = levelSelect.value;
            const levelScopeList = rawVocab.filter(item => (selectedLevel === 'all') || (item.level === selectedLevel));
            
            const masteredCount = levelScopeList.filter(item => masteredIds.includes(item.id)).length;
            const unmasteredCount = levelScopeList.length - masteredCount;

            document.getElementById('stat-mastered').textContent = masteredCount;
            document.getElementById('stat-unmastered').textContent = unmasteredCount;
        }

        function updateCardDisplay() {
            updateStats();

            if (currentFilteredList.length === 0) {
                document.getElementById('cardContainer').style.display = 'none';
                actionButtons.style.display = 'none';
                controls.style.display = 'none';
                emptyMessage.style.display = 'block';
                return;
            }

            document.getElementById('cardContainer').style.display = 'block';
            actionButtons.style.display = 'flex';
            controls.style.display = 'flex';
            emptyMessage.style.display = 'none';

            if (isFlipped) {
                cardElement.classList.remove('flipped');
                isFlipped = false;
                setTimeout(renderContent, 200);
            } else {
                renderContent();
            }
        }

        function renderContent() {
            const current = currentFilteredList[currentIndex];
            kanjiElement.textContent = current.kanji;
            readingElement.textContent = current.reading;
            meaningElement.textContent = current.meaning;
            counterElement.textContent = `${currentIndex + 1} / ${currentFilteredList.length}`;

            // Status & Level Tagging
            const isMastered = masteredIds.includes(current.id);
            const tagText = isMastered ? "✅ Sudah Hafal" : "❌ Belum Hafal";
            const tagClass = isMastered ? "status-tag mastered" : "status-tag unmastered";

            statusTagFront.textContent = tagText;
            statusTagFront.className = tagClass;
            statusTagBack.textContent = tagText;
            statusTagBack.className = tagClass;

            levelTagFront.textContent = current.level;
            levelTagBack.textContent = current.level;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            cardElement.classList.toggle('flipped');
        }

        function markStatus(isMastered) {
            if (currentFilteredList.length === 0) return;

            const current = currentFilteredList[currentIndex];

            if (isMastered) {
                if (!masteredIds.includes(current.id)) {
                    masteredIds.push(current.id);
                }
            } else {
                masteredIds = masteredIds.filter(id => id !== current.id);
            }

            // Simpan ke LocalStorage
            localStorage.setItem('kanji_mastered_ids_v2', JSON.stringify(masteredIds));

            const selectedStatus = statusSelect.value;
            if ((selectedStatus === 'mastered' && !isMastered) || (selectedStatus === 'unmastered' && isMastered)) {
                currentFilteredList.splice(currentIndex, 1);
                if (currentIndex >= currentFilteredList.length) {
                    currentIndex = Math.max(0, currentFilteredList.length - 1);
                }
                updateCardDisplay();
            } else {
                updateCardDisplay();
            }
        }

        function nextCard() {
            if (currentFilteredList.length === 0) return;
            currentIndex = (currentIndex < currentFilteredList.length - 1) ? currentIndex + 1 : 0;
            updateCardDisplay();
        }

        function prevCard() {
            if (currentFilteredList.length === 0) return;
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : currentFilteredList.length - 1;
            updateCardDisplay();
        }

        function shuffleCards() {
            if (currentFilteredList.length === 0) return;
            for (let i = currentFilteredList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentFilteredList[i], currentFilteredList[j]] = [currentFilteredList[j], currentFilteredList[i]];
            }
            currentIndex = 0;
            updateCardDisplay();
        }

        // Inisialisasi Tampilan
        applyFilter();
